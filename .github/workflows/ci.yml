name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scholarflow
          POSTGRES_PASSWORD: scholarflow
          POSTGRES_DB: scholarflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarflow -d scholarflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scholarflow:scholarflow@localhost:5432/scholarflow?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run db:deploy -w @scholarflow/api
      - run: npm test
